name: Feature
description: Une capacité nouvelle, visible par l'utilisateur
title: "owlog-FEAT#/ "
labels: ["type:feat"]
body:
  - type: textarea
    id: intent
    attributes:
      label: Intention
      description: Le problème à résoudre ou l'effet recherché, pas la solution technique.
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Ce qui doit être vrai pour clore l'issue.
      placeholder: "- [ ] ..."
    validations: { required: true }
  - type: dropdown
    id: scope
    attributes:
      label: Paquets touchés
      multiple: true
      options:
        - apps/web
        - apps/api
        - packages/domain
        - packages/contracts
        - infrastructure / CI
  - type: textarea
    id: notes
    attributes:
      label: Notes / décisions
      description: Contexte, contraintes, pistes écartées, liens vers les documents de conception.
