name: Feature
description: Une capacité nouvelle, visible par l'utilisateur
title: "owlog-FEAT#/ "
labels: ["type:feat"]
body:
  # Bloc d'affichage : n'apparaît pas dans le corps de l'issue créée.
  - type: markdown
    attributes:
      value: |
        **Après création : complète le `#` du titre avec le numéro attribué**
        (`owlog-FEAT#42/ …`), puis renseigne `Priority` et `Size` dans le
        Project — poser le label ne remplit pas ces champs. Une feature de
        taille L ou XL se découpe en sous-issues natives.
  - type: textarea
    id: intent
    attributes:
      label: Intention
      description: Le problème à résoudre ou l'effet recherché, pas la solution technique.
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Ce qui doit être vrai pour clore l'issue.
      placeholder: "- [ ] ..."
    validations: { required: true }
  - type: dropdown
    id: scope
    attributes:
      label: Paquets touchés
      multiple: true
      options:
        - apps/web
        - apps/api
        - packages/domain
        - packages/contracts
        - infrastructure / CI
  - type: textarea
    id: notes
    attributes:
      label: Notes / décisions
      description: Contexte, contraintes, pistes écartées, liens vers les documents de conception.
