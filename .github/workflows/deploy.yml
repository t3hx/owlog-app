# Déploiement continu — chaque fusion sur `main` met l'app en ligne.
#
# `main` n'accepte que des PR squashées et sa CI est verte : tout ce qui y
# arrive est réputé déployable. Cette PR fusionnée déclenche donc, sans autre
# intervention : build des deux images → poussée sur GHCR → Dokploy tire et
# redémarre → vérification de santé. Le build se fait ici, sur GitHub, jamais
# sur le VPS.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Les deux images sont indépendantes : on les construit en parallèle.
      matrix:
        include:
          - { image: owlog-web, dockerfile: apps/web/Dockerfile }
          - { image: owlog-api, dockerfile: apps/api/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` est le tag que Dokploy tire ; le tag par SHA sert de trace
          # et permet un rollback ciblé si besoin.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Les build-args vivent ICI, pas dans le matrix : le contexte `secrets`
      # n'y est pas disponible (il s'évaluerait en chaîne vide, et le
      # Dockerfile web refuserait de se construire). owlog-web les consomme —
      # adresse d'API et jeton partagé, PUBLICS par nature ; la clé TMDB ne
      # quitte jamais l'API. owlog-api ne déclare pas ces ARG : BuildKit les
      # ignore avec un avertissement inoffensif.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_SHARED_TOKEN=${{ secrets.OWLOG_SHARED_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Le panneau Dokploy n'est joignable que par le tailnet (aucun port web
      # ouvert en entrée sur le VPS). Le runner s'y raccorde le temps du job.
      - name: Connexion au tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # L'API d'abord, le web ensuite : le front ne doit jamais tourner contre
      # une API plus ancienne que lui.
      - name: Déployer owlog-api
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID_BACK }}"}'

      - name: Déployer owlog-web
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID_FRONT }}"}'

      # `APP_HEALTH_URL` est une VARIABLE (pas un secret) : la sonde publique
      # `https://owlog.nspace.link/api/health`. On réutilise la route existante.
      - name: Attendre et vérifier la santé
        run: |
          sleep 45
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_HEALTH_URL }}")
            [ "$code" = "200" ] && echo "healthy" && exit 0
            echo "tentative $i : $code — nouvel essai dans 15 s"; sleep 15
          done
          echo "le déploiement n'est pas devenu sain" && exit 1
