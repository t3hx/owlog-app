name: project-sync
on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/t3hx/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          # Optionnel : n'ajouter que certains labels
          labeled: type:bug, type:feat, type:fix
          label-operator: OR